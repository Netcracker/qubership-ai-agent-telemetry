name: Validate Renovate Config

on:
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/scripts/test-renovate-automerge.mjs
      - .github/scripts/test-renovate-go-minimum.mjs
      - .github/workflows/renovate-config-lint.yaml
  pull_request: {}
  schedule:
    - cron: "18 9 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: renovate-config-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Renovate changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - name: Detect Renovate changes
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            renovate:
              - 'renovate.json'
              - '.github/scripts/test-renovate-automerge.mjs'
              - '.github/scripts/test-renovate-go-minimum.mjs'
              - '.github/workflows/renovate-config-lint.yaml'

  validate-renovate-config:
    name: Validate renovate.json
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.renovate == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      reason: ${{ steps.validate.outputs.reason }}
    container:
      image: renovate/renovate:44.61.0@sha256:4419efe9c851e70a983b260c893c4cbec8d9dc3ae634093743077b35a22b3257
      options: --user 0
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate configuration and resolve shared presets
        id: validate
        uses: netcracker/qubership-workflow-hub/actions/renovate-validate@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}

      - name: Test minimum Go version policy
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: node .github/scripts/test-renovate-go-minimum.mjs

      - name: Test Renovate automerge policy
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: node .github/scripts/test-renovate-automerge.mjs

  ci-gate:
    name: Renovate Gate
    needs: [changes, validate-renovate-config]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUN_TESTS: ${{ needs.changes.outputs.renovate }}
      JOB_RESULT: ${{ needs.validate-renovate-config.result }}
    steps:
      - name: Require validation when applicable
        shell: bash
        run: |
          if [ "$CHANGES_RESULT" != 'success' ] ||
            { [ "$RUN_TESTS" != 'false' ] && [ "$JOB_RESULT" != 'success' ]; }; then
            echo "Renovate validation did not succeed when required" >&2
            exit 1
          fi

  lookup-renovate-dependencies:
    # Set the Actions variable RENOVATE_HEALTH_CHECK to false when this
    # repository intentionally does not run Renovate. Validation remains active
    # so local and inherited configuration errors are still reported.
    name: Look up Renovate dependencies
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && vars.RENOVATE_HEALTH_CHECK != 'false'
    runs-on: ubuntu-latest
    outputs:
      reason: ${{ steps.lookup.outputs.reason }}
    container:
      image: renovate/renovate:44.61.0@sha256:4419efe9c851e70a983b260c893c4cbec8d9dc3ae634093743077b35a22b3257
      options: --user 0
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look up dependencies
        id: lookup
        uses: netcracker/qubership-workflow-hub/actions/renovate-lookup@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}

  monitor-renovate:
    name: Monitor Renovate health
    if: >-
      ${{ !cancelled()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && vars.RENOVATE_HEALTH_CHECK != 'false' }}
    needs:
      - validate-renovate-config
      - lookup-renovate-dependencies
    runs-on: ubuntu-latest
    concurrency:
      group: renovate-health-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect Dependency Dashboard and report health
        uses: netcracker/qubership-workflow-hub/actions/renovate-monitor@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        with:
          validation-result: ${{ needs.validate-renovate-config.result }}
          lookup-result: ${{ needs.lookup-renovate-dependencies.result }}
          validation-reason: ${{ needs.validate-renovate-config.outputs.reason }}
          lookup-reason: ${{ needs.lookup-renovate-dependencies.outputs.reason }}
