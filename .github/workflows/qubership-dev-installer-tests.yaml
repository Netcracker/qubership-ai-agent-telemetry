name: Qubership Developer Installer Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "cli.go"
      - "component_*.go"
      - "lifecycle*.go"
      - "managed_cli*.go"
      - "update*.go"
      - "scripts/**"
      - "global-scripts/**"
      - "Makefile"
      - "README.md"
      - "agent-packages/ai-agent-telemetry/README.md"
      - "agent-packages/ai-agent-telemetry-configure/README.md"
      - "docs/agent-integration.md"
      - "docs/adr/0002-bare-binary-on-path.md"
      - "docs/adr/0005-cli-managed-global-hooks.md"
      - "docs/cli.md"
      - "docs/release.md"
      - "docs/superpowers/decisions/2026-06-23-codex-sandbox-execpolicy-rule.md"
      - "docs/superpowers/decisions/2026-06-23-on-path-binary-lifecycle.md"
      - ".github/workflows/installer-tests.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/qubership-dev-installer-tests.yaml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "cli.go"
      - "component_*.go"
      - "lifecycle*.go"
      - "managed_cli*.go"
      - "update*.go"
      - "scripts/**"
      - "global-scripts/**"
      - "Makefile"
      - "README.md"
      - "agent-packages/ai-agent-telemetry/README.md"
      - "agent-packages/ai-agent-telemetry-configure/README.md"
      - "docs/agent-integration.md"
      - "docs/adr/0002-bare-binary-on-path.md"
      - "docs/adr/0005-cli-managed-global-hooks.md"
      - "docs/cli.md"
      - "docs/release.md"
      - "docs/superpowers/decisions/2026-06-23-codex-sandbox-execpolicy-rule.md"
      - "docs/superpowers/decisions/2026-06-23-on-path-binary-lifecycle.md"
      - ".github/workflows/installer-tests.yaml"
      - ".github/workflows/release.yaml"
      - ".github/workflows/qubership-dev-installer-tests.yaml"
  workflow_dispatch: null

concurrency:
  group: qubership-dev-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  posix:
    name: POSIX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run black-box tests
        run: sh global-scripts/tests/qubership-dev-install_test.sh

      - name: Run ShellCheck
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: shellcheck scripts/install.sh global-scripts/qubership-dev-install.sh global-scripts/tests/qubership-dev-install_test.sh

  powershell:
    name: PowerShell (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run black-box tests with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -File global-scripts/tests/qubership-dev-install.Tests.ps1

      - name: Run black-box tests with PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File global-scripts/tests/qubership-dev-install.Tests.ps1
