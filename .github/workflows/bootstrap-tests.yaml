name: Bootstrap Transport Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/install_test.sh"
      - "scripts/install.Tests.ps1"
      - ".github/workflows/bootstrap-tests.yaml"
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch: null

concurrency:
  group: bootstrap-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Bootstrap changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - name: Detect bootstrap changes
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            bootstrap:
              - 'scripts/install.sh'
              - 'scripts/install.ps1'
              - 'scripts/install_test.sh'
              - 'scripts/install.Tests.ps1'
              - 'go.mod'
              - '.github/workflows/bootstrap-tests.yaml'

  posix:
    name: POSIX (${{ matrix.os }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.bootstrap == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run black-box tests
        run: sh scripts/install_test.sh

      - name: Run ShellCheck
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: shellcheck scripts/install.sh scripts/install_test.sh

  powershell:
    name: PowerShell (windows-latest)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.bootstrap == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run black-box tests with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -File scripts/install.Tests.ps1

      - name: Run black-box tests with PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File scripts/install.Tests.ps1

  ci-gate:
    name: Bootstrap CI Gate
    needs: [changes, posix, powershell]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # This stable, always-created check is the branch-protection gate. The
    # test jobs are filtered inside the workflow so their skipped state cannot
    # be required directly; this also avoids a pending check when no bootstrap
    # files changed in a pull request.
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUN_TESTS: ${{ github.event_name != 'pull_request' || needs.changes.outputs.bootstrap == 'true' }}
      JOB_RESULTS: ${{ needs.posix.result }} ${{ needs.powershell.result }}
    steps:
      - name: Fail when a required job did not succeed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "Bootstrap change detection finished with $CHANGES_RESULT" >&2
            exit 1
          fi

          read -r -a results <<<"$JOB_RESULTS"
          expected_result=skipped
          if [ "$RUN_TESTS" = 'true' ]; then
            expected_result=success
          elif [ "$RUN_TESTS" != 'false' ]; then
            echo "Bootstrap change detection returned $RUN_TESTS" >&2
            exit 1
          fi

          for result in "${results[@]}"; do
            if [ "$result" != "$expected_result" ]; then
              echo "Expected $expected_result, got $result" >&2
              exit 1
            fi
          done
