name: Bootstrap Transport Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/install_test.sh"
      - "scripts/install.Tests.ps1"
      - ".github/workflows/bootstrap-tests.yaml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "scripts/install_test.sh"
      - "scripts/install.Tests.ps1"
      - ".github/workflows/bootstrap-tests.yaml"
  workflow_dispatch: null

concurrency:
  group: bootstrap-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  posix:
    name: POSIX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run black-box tests
        run: sh scripts/install_test.sh

      - name: Run ShellCheck
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: shellcheck scripts/install.sh scripts/install_test.sh

  powershell:
    name: PowerShell (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run black-box tests with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -File scripts/install.Tests.ps1

      - name: Run black-box tests with PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File scripts/install.Tests.ps1
