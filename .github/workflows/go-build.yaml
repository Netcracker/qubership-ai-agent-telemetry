# This workflow builds and tests the Go project.
# Forked from Netcracker/.github workflow-templates/go-build.yaml.
# The SonarCloud step from the template is dropped: this repo has no Sonar
# project, and the checks below mirror the retired ci.yml (build, vet, test,
# gofmt).
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build Go Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: go-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Go changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Detect Go changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            go:
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'testdata/**'
              - 'agent-packages/ai-agent-telemetry/.apm/hooks/**'
              - 'agent-packages/ai-agent-telemetry-configure/.apm/skills/ai-agent-telemetry-configure/references/codex-sandbox.md'
              - '.github/workflows/go-build.yaml'
              - '.github/workflows/bootstrap-tests.yaml'
              - '.github/workflows/installer-tests.yaml'
              - '.github/workflows/super-linter.yaml'
              - '.github/workflows/telemetry-backend-tests.yaml'

  build:
    name: "Build and Test Go Project"
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: "Check formatting"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: "Vet"
        run: go vet ./...

      - name: "Build"
        run: go build -v ./...

      - name: "Test"
        run: go test ./...

  hook-platform-tests:
    name: "Global hooks (${{ matrix.os }})"
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux hook coverage is part of the full build job above.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: "Test global hook files"
        env:
          HOME: ${{ runner.temp }}/hook-home
          USERPROFILE: ${{ runner.temp }}/hook-user-profile
        run: go test ./... -run '^Test.*(Hook|Configure($|[A-Z]))' -count=1

  # This stable, always-created check is the branch-protection gate. The test
  # jobs are intentionally path-filtered, so their own skipped state cannot be
  # required directly.
  ci-gate:
    name: Go CI Gate
    needs: [changes, build, hook-platform-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUN_TESTS: ${{ needs.changes.outputs.go }}
      JOB_RESULTS: ${{ needs.build.result }} ${{ needs.hook-platform-tests.result }}
    steps:
      - name: Fail when a required job did not succeed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "Go change detection finished with $CHANGES_RESULT" >&2
            exit 1
          fi

          read -r -a results <<<"$JOB_RESULTS"
          expected_result=skipped
          if [ "$RUN_TESTS" = 'true' ]; then
            expected_result=success
          elif [ "$RUN_TESTS" != 'false' ]; then
            echo "Go change detection returned $RUN_TESTS" >&2
            exit 1
          fi

          for result in "${results[@]}"; do
            if [ "$result" != "$expected_result" ]; then
              echo "Expected $expected_result, got $result" >&2
              exit 1
            fi
          done
