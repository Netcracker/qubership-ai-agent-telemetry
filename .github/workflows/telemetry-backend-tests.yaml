name: Telemetry Backend Tests
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  push:
    branches:
      - "main"
    paths:
      - "telemetry-backend/**"
      - "scripts/package-backend-release.sh"
      - "scripts/package_backend_release_test.sh"
      - ".github/workflows/telemetry-backend-tests.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: null

concurrency:
  group: telemetry-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Backend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Detect backend changes
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'telemetry-backend/**'
              - 'scripts/package-backend-release.sh'
              - 'scripts/package_backend_release_test.sh'
              - '.github/workflows/telemetry-backend-tests.yaml'

  smoke:
    name: Backend smoke (ubuntu-latest)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify backend configuration
        run: sh telemetry-backend/tests/config-contract.sh

      - name: Verify VictoriaMetrics query retry bounds
        run: sh telemetry-backend/tests/metrics-query-retry-test.sh

      - name: Verify backend release packaging
        run: bash scripts/package_backend_release_test.sh

      - name: Verify maintenance contracts
        run: |
          bash telemetry-backend/tests/maintenance-contract.sh cli
          bash telemetry-backend/tests/maintenance-contract.sh resolution
          bash telemetry-backend/tests/maintenance-contract.sh activation
          bash telemetry-backend/tests/maintenance-contract.sh recovery
          bash telemetry-backend/tests/maintenance-contract.sh restore-portability
          bash telemetry-backend/tests/maintenance-contract.sh retention

      - name: Run backend smoke test
        run: sh telemetry-backend/tests/smoke.sh

  ci-gate:
    name: Backend CI Gate
    needs: [changes, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # This stable, always-created check is the branch-protection gate. The
    # test job is filtered inside the workflow so its skipped state cannot be
    # required directly; this also avoids a pending check when no backend
    # files changed in a pull request.
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      RUN_TESTS: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
      JOB_RESULT: ${{ needs.smoke.result }}
    steps:
      - name: Fail when a required job did not succeed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != 'success' ]; then
            echo "Backend change detection finished with $CHANGES_RESULT" >&2
            exit 1
          fi

          expected_result=skipped
          if [ "$RUN_TESTS" = 'true' ]; then
            expected_result=success
          elif [ "$RUN_TESTS" != 'false' ]; then
            echo "Backend change detection returned $RUN_TESTS" >&2
            exit 1
          fi

          if [ "$JOB_RESULT" != "$expected_result" ]; then
            echo "Expected $expected_result, got $JOB_RESULT" >&2
            exit 1
          fi
