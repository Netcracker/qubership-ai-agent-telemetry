name: Telemetry Backend Tests
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  push:
    branches:
      - "main"
    paths:
      - "telemetry-backend/**"
      - ".github/workflows/telemetry-backend-tests.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "telemetry-backend/**"
      - ".github/workflows/telemetry-backend-tests.yaml"
  workflow_dispatch: null

concurrency:
  group: telemetry-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Backend smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify backend configuration
        run: sh telemetry-backend/tests/config-contract.sh

      - name: Verify VictoriaMetrics query retry bounds
        run: sh telemetry-backend/tests/metrics-query-retry-test.sh

      - name: Run backend smoke test
        run: sh telemetry-backend/tests/smoke.sh
