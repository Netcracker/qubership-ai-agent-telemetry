name: Telemetry Backend Tests
run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  push:
    branches:
      - "main"
    paths:
      - "telemetry-backend/**"
      - "scripts/package-backend-release.sh"
      - "scripts/package_backend_release_test.sh"
      - ".github/workflows/telemetry-backend-tests.yaml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "telemetry-backend/**"
      - "scripts/package-backend-release.sh"
      - "scripts/package_backend_release_test.sh"
      - ".github/workflows/telemetry-backend-tests.yaml"
  workflow_dispatch: null

concurrency:
  group: telemetry-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Backend smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify backend configuration
        run: sh telemetry-backend/tests/config-contract.sh

      - name: Verify VictoriaMetrics query retry bounds
        run: sh telemetry-backend/tests/metrics-query-retry-test.sh

      - name: Verify backend release packaging
        run: bash scripts/package_backend_release_test.sh

      - name: Verify maintenance contracts
        run: |
          bash telemetry-backend/tests/maintenance-contract.sh cli
          bash telemetry-backend/tests/maintenance-contract.sh resolution
          bash telemetry-backend/tests/maintenance-contract.sh activation
          bash telemetry-backend/tests/maintenance-contract.sh recovery
          bash telemetry-backend/tests/maintenance-contract.sh restore-portability
          bash telemetry-backend/tests/maintenance-contract.sh retention

      - name: Run backend smoke test
        run: sh telemetry-backend/tests/smoke.sh
