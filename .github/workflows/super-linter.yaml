---
# Forked from Netcracker/.github workflow-templates/super-linter.yaml.
# Runs super-linter over changed files. Linter configuration is pulled from
# netcracker/.github (config/linters); override locally with
# .github/super-linter.env or .github/linters/* if needed.
# For more information, see: https://github.com/super-linter/super-linter

name: Lint Code Base

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      full_scan:
        type: boolean
        default: false
        required: false
        description: "Lint all codebase"

concurrency:
  group: super-linter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  super-linter:
    name: "Lint Code Base"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: "Get the common linters configuration"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          repository: netcracker/.github
          persist-credentials: false
          path: common-configs
          sparse-checkout: |
            config/linters
      - name: "Move configs"
        run: |
          cp --update=none -vRT ./common-configs/config/linters /tmp/linters
          rm -rf ./common-configs
      # To report GitHub Actions status checks
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false
      - name: "Apply the common linters configuration"
        run: |
          mkdir -p ./.github/linters
          cp --update=none -vRT /tmp/linters ./.github/linters

      - name: "Load super-linter environment file"
        shell: bash
        run: |
          # shellcheck disable=2086
          if [ -f "${GITHUB_WORKSPACE}/.github/super-linter.env" ]; then
            echo "Applying local linter environment:"
            grep "\S" ${GITHUB_WORKSPACE}/.github/super-linter.env | grep -v "^#"
            grep "\S" ${GITHUB_WORKSPACE}/.github/super-linter.env | grep -v "^#" >> $GITHUB_ENV
          elif [ -f "/tmp/linters/super-linter.env" ]; then
            echo "::warning:: Local linter environment file .github/super-linter.env is not found"
            echo "Applying common linter environment:"
            grep "\S" /tmp/linters/super-linter.env | grep -v "^#"
            grep "\S" /tmp/linters/super-linter.env | grep -v "^#" >> $GITHUB_ENV
          fi

      - name: "Lint Code Base"
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ inputs.full_scan || false }}
          FILTER_REGEX_EXCLUDE: '(^|/)docs/superpowers/'
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.pull_request.base.ref || github.event.push.ref }}
