name: APM Package Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "agent-packages/**"
      - "scripts/apm_compile_test.sh"
      - ".github/workflows/apm-package-tests.yaml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "agent-packages/**"
      - "scripts/apm_compile_test.sh"
      - ".github/workflows/apm-package-tests.yaml"
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  compile:
    name: Preserve canonical AGENTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned APM CLI
        env:
          APM_VERSION: 0.28.0
          APM_SHA256: 7edab3baba96658a20120fc8f3012e3223da7924937a8cbf169bf9805853b8d7
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apm-linux-x86_64.tar.gz"
          bin_dir="$RUNNER_TEMP/apm-bin"
          curl -fsSL \
            "https://github.com/microsoft/apm/releases/download/v${APM_VERSION}/apm-linux-x86_64.tar.gz" \
            -o "$archive"
          echo "$APM_SHA256  $archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" --strip-components=1
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify APM version
        run: apm --version | grep -F "version 0.28.0"

      - name: Test Codex context compilation
        run: sh scripts/apm_compile_test.sh
