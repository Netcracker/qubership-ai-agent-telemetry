name: ai-agent-telemetry-backend

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.24.0-victorialogs@sha256:1ec31ddccc39dc9ead2607cddbf2829be1eb5ad39890e72bba26b359be20801d
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=${VL_RETENTION:-365d}
    volumes:
      - vlogs-data:/vlogs
    networks:
      - backend
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.1@sha256:c7884f32920dd45a9d86542a717227e63af03e060e53bbf8031e6e6fd0e1e05d
    command:
      - -storageDataPath=/vmetrics
      - -retentionPeriod=${VM_RETENTION:-365d}
      - -opentelemetry.usePrometheusNaming
      - -storage.maxHourlySeries=${VM_MAX_HOURLY_SERIES:-50000}
      - -storage.maxDailySeries=${VM_MAX_DAILY_SERIES:-200000}
      - -storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK_SPACE_BYTES:-1073741824}
      - -selfScrapeInterval=${VM_SELF_SCRAPE_INTERVAL:-30s}
    volumes:
      - vmetrics-data:/vmetrics
    networks:
      - backend
    restart: unless-stopped

  collector:
    image: otel/opentelemetry-collector-contrib:0.163.1@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    networks:
      - backend
    depends_on:
      - victorialogs
      - victoriametrics
    restart: unless-stopped

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    environment:
      - GF_SERVER_ROOT_URL=https://${SITE_ADDRESS}:${HTTPS_PORT:-443}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN=true
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      - victorialogs
      - victoriametrics
    restart: unless-stopped

  caddy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
      - CADDY_TLS=${CADDY_TLS}
      - INGEST_TOKEN=${INGEST_TOKEN}
      - DASHBOARD_AUTH_USER=${DASHBOARD_AUTH_USER:?set DASHBOARD_AUTH_USER}
      - DASHBOARD_AUTH_PASSWORD_HASH=${DASHBOARD_AUTH_PASSWORD_HASH:?set DASHBOARD_AUTH_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      - collector
      - victoriametrics
    restart: unless-stopped

networks:
  backend: {}

volumes:
  vlogs-data: {}
  vmetrics-data: {}
  grafana-data: {}
  caddy-data: {}
  caddy-config: {}
