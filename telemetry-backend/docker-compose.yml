name: ai-agent-telemetry-backend

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.24.0-victorialogs@sha256:1ec31ddccc39dc9ead2607cddbf2829be1eb5ad39890e72bba26b359be20801d
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=${VL_RETENTION:-365d}
    volumes:
      - vlogs-data:/vlogs
    networks:
      - backend
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0@sha256:f60dc268b54ecf87f6e09d740c2b732838aa9193090cc741417c9f6386a130df
    command:
      - -storageDataPath=/vmetrics
      - -retentionPeriod=${VM_RETENTION:-365d}
      - -opentelemetry.usePrometheusNaming
      - -storage.maxHourlySeries=${VM_MAX_HOURLY_SERIES:-50000}
      - -storage.maxDailySeries=${VM_MAX_DAILY_SERIES:-200000}
      - -storage.minFreeDiskSpaceBytes=${VM_MIN_FREE_DISK_SPACE_BYTES:-1073741824}
      - -selfScrapeInterval=${VM_SELF_SCRAPE_INTERVAL:-30s}
    volumes:
      - vmetrics-data:/vmetrics
    networks:
      - backend
    restart: unless-stopped

  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    networks:
      - backend
    depends_on:
      - victorialogs
      - victoriametrics
    restart: unless-stopped

  # Copies the Grafana plugins this backend needs from the plugin image into grafana-plugins, then exits.
  grafana-plugins-init:
    image: ${GRAFANA_PLUGINS_INIT_IMAGE:-ghcr.io/netcracker/qubership-grafana-plugins-init:0.22.0@sha256:3e9e0cdb02e2e7c0ef911950414b1c68f205ef9eafe9bcc1ada89a09fc4a3cfe}
    # The image's default user cannot write to a new, root-owned volume. No capabilities are needed to write there as
    # its owner.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    network_mode: none
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        find /plugins -mindepth 1 -delete
        for plugin in victoriametrics-logs-datasource; do
          cp -R "/etc/grafana/plugins/$$plugin" /plugins/
        done
    volumes:
      - grafana-plugins:/plugins
    restart: "no"

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      - GF_SERVER_ROOT_URL=https://${SITE_ADDRESS}:${HTTPS_PORT:-443}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN=true
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PLUGINS=/var/lib/grafana-plugins
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-plugins:/var/lib/grafana-plugins:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend
    depends_on:
      grafana-plugins-init:
        condition: service_completed_successfully
      victorialogs:
        condition: service_started
      victoriametrics:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
      - CADDY_TLS=${CADDY_TLS}
      - INGEST_TOKEN=${INGEST_TOKEN}
      - DASHBOARD_AUTH_USER=${DASHBOARD_AUTH_USER:?set DASHBOARD_AUTH_USER}
      - DASHBOARD_AUTH_PASSWORD_HASH=${DASHBOARD_AUTH_PASSWORD_HASH:?set DASHBOARD_AUTH_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_CERTS_DIR:-./certs}:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      - collector
      - victoriametrics
    restart: unless-stopped

networks:
  backend: {}

volumes:
  vlogs-data: {}
  vmetrics-data: {}
  grafana-data: {}
  grafana-plugins: {}
  caddy-data: {}
  caddy-config: {}
